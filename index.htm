<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Quest - 網頁程式作品集入口</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-green: #39ff14;
            --neon-purple: #9d00ff;
            --bg-dark: #0a0a12;
        }

        body {
            font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Y2K Dynamic Grid Background */
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 127, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Glowing Scanline effect */
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 243, 255, 0.2) 50%,
                rgba(0, 243, 255, 0.2)
            );
            background-size: 100% 4px;
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(18, 18, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card-unlocked {
            background: rgba(22, 27, 46, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card-unlocked:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .glass-card-locked {
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            opacity: 0.6;
            filter: grayscale(80%);
            transition: all 0.3s ease;
        }

        .glass-card-locked:hover {
            opacity: 0.8;
            border-color: rgba(255, 0, 85, 0.4);
            filter: grayscale(50%);
        }

        /* Hologram Avatar Border */
        .avatar-frame {
            position: relative;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan), var(--neon-green), var(--neon-purple));
            background-size: 300% 300%;
            animation: gradientBorder 6s ease infinite;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Y2K Text Glow */
        .text-glow-cyan {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .text-glow-pink {
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.7), 0 0 20px rgba(255, 0, 127, 0.4);
        }

        /* Cyber Button Badge */
        .cyber-badge {
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }
    </style>
</head>
<body class="cyber-grid scanline relative flex flex-col items-center justify-between p-4 sm:p-8 min-h-screen">

    <!-- Ambient Glowing Orbs -->
    <div class="fixed top-1/4 left-10 w-72 h-72 bg-pink-600/20 rounded-full filter blur-[100px] pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-10 w-80 h-80 bg-cyan-500/20 rounded-full filter blur-[100px] pointer-events-none"></div>

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-6xl z-10 flex flex-col items-center">
        
        <!-- HEADER / PROFILE SECTION -->
        <header class="w-full glass-card rounded-2xl p-6 sm:p-8 mb-8 text-center relative overflow-hidden flex flex-col items-center">
            
            <!-- Top Status Bar -->
            <div class="w-full flex flex-wrap justify-between items-center text-xs sm:text-sm text-cyan-400 font-mono mb-6 border-b border-cyan-500/20 pb-3 gap-2">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-green-400 animate-ping"></span>
                    <span>STATUS: <strong class="text-green-400">ONLINE</strong></span>
                </div>
                <div class="tracking-widest">
                    <span>PLAYER: <strong class="text-pink-400">DEV_HERO#2026</strong></span>
                </div>
                <div>
                    <span>QUEST PROGRESS: <strong class="text-yellow-400">5 / 16 (31.25%)</strong></span>
                </div>
            </div>

            <!-- Profile Picture with Holographic Effect -->
            <div class="avatar-frame mb-4 w-28 h-28 sm:w-36 sm:h-36">
