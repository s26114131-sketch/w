<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 - 多人默契遊戲</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            morandi: {
              bg: '#F4F1EA',
              card: '#FFFFFF',
              text: '#37352F',
              muted: '#787774',
              primary: '#8B9B90',
              primaryHover: '#76857B',
              accent: '#B08E83',
              accentHover: '#98776C',
              border: '#E6E4DF',
              highlight: '#D6C5B3',
              blue: '#8FA3B0'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 3D CSS 翻牌動畫核心 */
    .perspective-1000 {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-morandi-bg text-morandi-text font-sans min-h-screen flex flex-col justify-between">

  <!-- 頂部導覽列 -->
  <header class="max-w-4xl w-full mx-auto px-5 py-4 flex justify-between items-center border-b border-morandi-border">
    <div class="flex items-center space-x-2">
      <span class="text-xl">🧠</span>
      <h1 class="text-lg font-semibold tracking-tight">雲端心電感應</h1>
    </div>
    
    <div class="flex items-center space-x-3">
      <span id="sync-status" class="text-xs px-2.5 py-1 rounded-md bg-morandi-border/60 text-morandi-muted">
        等待登入
      </span>

      <!-- 隱藏房主控制台按鈕 -->
      <button id="toggle-host-btn" type="button" title="切換房主控制台" class="text-xs px-2.5 py-1 rounded-md border border-transparent hover:border-morandi-border hover:bg-morandi-card opacity-30 hover:opacity-100 transition-all flex items-center gap-1 cursor-pointer">
        <span>⚙️</span> <span>房主</span>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl w-full mx-auto px-5 py-8 flex-grow flex flex-col justify-center">

    <!-- 畫面 1：房間代碼與玩家登入 -->
    <section id="view-lobby" class="bg-morandi-card border border-morandi-border rounded-xl p-7 shadow-sm max-w-md mx-auto w-full">
      <div class="text-center mb-6">
        <h2 class="text-lg font-semibold">加入默契房間</h2>
        <p class="text-xs text-morandi-muted mt-1">輸入相同房號即可進行分組連線</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-morandi-muted mb-1">玩家名稱</label>
          <input type="text" id="input-player-name" placeholder="請輸入你的名字" class="w-full px-3.5 py-2 bg-morandi-bg/40 border border-morandi-border rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-morandi-primary/40 text-sm">
        </div>

        <div>
          <label class="block text-xs font-medium text-morandi-muted mb-1">房間代碼</label>
          <div class="flex gap-2">
            <input type="text" id="input-room-code" placeholder="輸入房號 (例: 101)" class="w-full px-3.5 py-2 bg-morandi-bg/40 border border-morandi-border rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-morandi-primary/40 text-sm uppercase">
            <button id="btn-random-room" type="button" class="px-3.5 py-2 border border-morandi-border bg-morandi-bg/60 hover:bg-morandi-bg rounded-lg text-xs text-morandi-text whitespace-nowrap cursor-pointer">
              隨機產生
            </button>
          </div>
        </div>

        <button id="btn-join-room" type="button" class="w-full mt-2 py-2.5 bg-morandi-primary hover:bg-morandi-primaryHover text-white font-medium rounded-lg shadow-sm transition-colors text-sm cursor-pointer">
          進入房間
        </button>
      </div>
    </section>

    <!-- 畫面 2：遊戲主畫面 -->
    <section id="view-game" class="hidden space-y-6">
      
      <!-- 房間與玩家資訊條 -->
      <div class="flex flex-wrap justify-between items-center bg-morandi-card border border-morandi-border px-4 py-2.5 rounded-lg text-xs">
        <div class="flex items-center space-x-4">
          <div>
            <span class="text-morandi-muted">房號：</span>
            <span id="display-room-code" class="font-bold px-2 py-0.5 bg-morandi-bg rounded text-morandi-text">--</span>
          </div>
          <div>
            <span class="text-morandi-muted">玩家：</span>
            <span id="display-player-name" class="font-bold text-morandi-text">--</span>
          </div>
        </div>
        <button id="btn-leave-room" type="button" class="text-morandi-muted hover:text-morandi-accent cursor-pointer">
          切換房間 ↗
        </button>
      </div>

      <!-- 隱藏的房主控制台 (預設隱藏) -->
      <div id="host-panel" class="hidden bg-morandi-card border-2 border-morandi-highlight rounded-xl p-5 space-y-4 shadow-sm">
        <div class="flex justify-between items-center border-b border-morandi-border pb-2">
          <h3 class="font-semibold text-sm flex items-center gap-1.5">
            <span>👑</span> 房主控制台
          </h3>
          <span class="text-[11px] bg-morandi-highlight/40 text-morandi-text px-2 py-0.5 rounded">管理模式</span>
        </div>

        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="input-question" placeholder="輸入題目 (例: 夏天必吃的冰品？)" class="flex-grow px-3.5 py-2 bg-morandi-bg/40 border border-morandi-border rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-morandi-primary/40 text-sm">
          <button id="btn-set-question" type="button" class="px-4 py-2 bg-morandi-primary hover:bg-morandi-primaryHover text-white rounded-lg text-sm font-medium whitespace-nowrap cursor-pointer">
            出題並開始
          </button>
        </div>

        <div class="flex gap-2.5 pt-1">
          <button id="btn-reveal" type="button" class="flex-1 py-2 bg-morandi-accent hover:bg-morandi-accentHover text-white font-medium rounded-lg text-sm flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
            <span>🃏</span> 全體同步開牌
          </button>
          <button id="btn-reset" type="button" class="px-4 py-2 border border-morandi-border bg-morandi-bg/50 hover:bg-morandi-bg text-morandi-text rounded-lg text-sm cursor-pointer">
            重置題目
          </button>
        </div>
      </div>

      <!-- 題目顯示看板 -->
      <div class="bg-morandi-card border border-morandi-border rounded-xl p-6 text-center shadow-sm">
        <span class="inline-block text-xs font-medium text-morandi-accent bg-morandi-accent/10 px-2.5 py-0.5 rounded-full mb-2">
          本輪題目
        </span>
        <h2 id="display-question" class="text-xl sm:text-2xl font-bold text-morandi-text">
          等待房主出題中...
        </h2>
      </div>

      <!-- 玩家作答區 -->
      <div class="bg-morandi-card border border-morandi-border rounded-xl p-5 shadow-sm max-w-lg mx-auto w-full">
        <label class="block text-xs font-medium text-morandi-muted mb-2">你的直覺答案</label>
        <div class="flex gap-2">
          <input type="text" id="input-my-answer" placeholder="輸入答案..." class="flex-grow px-3.5 py-2 bg-morandi-bg/40 border border-morandi-border rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-morandi-primary/40 text-sm">
          <button id="btn-submit-answer" type="button" class="px-5 py-2 bg-morandi-blue hover:opacity-90 text-white font-medium rounded-lg text-sm whitespace-nowrap cursor-pointer">
            送出答案
          </button>
        </div>
        <p id="my-answer-status" class="text-xs text-morandi-primary mt-2 hidden">✓ 已送出答案（開牌前皆可修改重送）</p>
      </div>

      <!-- 3D 翻牌展示牆 -->
      <div class="pt-2">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-semibold text-morandi-muted">
            玩家卡片牆 (<span id="player-count">0</span> 人已作答)
          </h3>
          <span id="game-status-tag" class="text-xs px-2.5 py-0.5 rounded bg-morandi-border/60 text-morandi-muted">準備中</span>
        </div>

        <div id="cards-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
      </div>

    </section>

  </main>

  <footer class="max-w-4xl w-full mx-auto px-5 py-4 text-center text-[11px] text-morandi-muted border-t border-morandi-border">
    雲端心電感應 &bull; 多人即時默契遊戲
  </footer>

  <script>
    (function() {
      const SHEET_NAME = 'TelepathyData';
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzqyq-ENZl5GGwVQz5QnV7aEZzM_QPz2K_U7xdN91I64XX6K0ZZgmMnQz1tkDphmm_i/exec";

      let currentRoom = '';
      let currentName = '';
      let isHost = false;
      let pollingTimer = null;
      let lastRenderedHash = '';

      // 隨機產生 4 位數房號
      function generateRandomRoom() {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('input-room-code').value = code;
      }

      // 進入房間
      function joinRoom() {
        const name = document.getElementById('input-player-name').value.trim();
        const room = document.getElementById('input-room-code').value.trim();

        if (!name || !room) {
          alert('請輸入「玩家名稱」與「房間代碼」！');
          return;
        }

        currentName = name;
        currentRoom = room;
        lastRenderedHash = '';

        document.getElementById('display-player-name').innerText = currentName;
        document.getElementById('display-room-code').innerText = currentRoom;

        document.getElementById('view-lobby').classList.add('hidden');
        document.getElementById('view-game').classList.remove('hidden');

        fetchGameState();
        startPolling();
      }

      // 離開房間
      function leaveRoom() {
        stopPolling();
        currentRoom = '';
        currentName = '';
        lastRenderedHash = '';
        document.getElementById('input-my-answer').value = '';
        document.getElementById('my-answer-status').classList.add('hidden');
        document.getElementById('view-game').classList.add('hidden');
        document.getElementById('view-lobby').classList.remove('hidden');
      }

      // 開關隱藏房主面板
      function toggleHostConsole() {
        isHost = !isHost;
        const panel = document.getElementById('host-panel');
        if (isHost) {
          panel.classList.remove('hidden');
        } else {
          panel.classList.add('hidden');
        }
      }

      // GET 抓取遊戲資料
      async function fetchGameState() {
        if (!currentRoom) return;

        try {
          const url = `${GAS_API_URL}?room=${encodeURIComponent(currentRoom)}&t=${Date.now()}`;
          const response = await fetch(url, {
            method: 'GET',
            redirect: 'follow'
          });
          
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();
          
          updateSyncStatus('連線正常', 'bg-morandi-primary/20 text-morandi-primary');
          renderGameUI(data);
        } catch (err) {
          console.error('Fetch Error:', err);
          updateSyncStatus('GAS連線異常', 'bg-red-100 text-red-600');
        }
      }

      // POST 寫入資料至 GAS
      async function postGASData(payload) {
        try {
          updateSyncStatus('傳送中...', 'bg-morandi-highlight/40 text-morandi-text');
          const response = await fetch(GAS_API_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ room: currentRoom, ...payload })
          });
          
          const result = await response.json();
          if (result && result.success) {
            await fetchGameState();
          }
        } catch (err) {
          console.error('Post Error:', err);
          alert('GAS 連線失敗！請確認 Google 試算表內已有「TelepathyData」工作表，且 GAS 部署權限設為「任何人」。');
        }
      }

      function hostSetQuestion() {
        const q = document.getElementById('input-question').value.trim();
        if (!q) return alert('請輸入題目！');
        postGASData({ action: 'set_question', question: q });
        document.getElementById('input-question').value = '';
        document.getElementById('my-answer-status').classList.add('hidden');
      }

      function hostReveal() {
        postGASData({ action: 'reveal' });
      }

      function hostReset() {
        if (confirm('確定要清空題目與所有人的答案嗎？')) {
          postGASData({ action: 'reset' });
          document.getElementById('input-my-answer').value = '';
          document.getElementById('my-answer-status').classList.add('hidden');
        }
      }

      function submitAnswer() {
        const ans = document.getElementById('input-my-answer').value.trim();
        if (!ans) return alert('請輸入你的答案！');
        postGASData({ action: 'submit_answer', playerName: currentName, answer: ans });
        document.getElementById('my-answer-status').classList.remove('hidden');
      }

      function startPolling() {
        stopPolling();
        pollingTimer = setInterval(fetchGameState, 2500);
      }

      function stopPolling() {
        if (pollingTimer) clearInterval(pollingTimer);
      }

      function updateSyncStatus(text, className) {
        const el = document.getElementById('sync-status');
        if (!el) return;
        el.innerText = text;
        el.className = `text-xs px-2.5 py-1 rounded-md transition-all ${className}`;
      }

      function escapeHTML(str) {
        return String(str).replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
      }

      function renderGameUI(data) {
        const currentHash = JSON.stringify(data);
        if (currentHash === lastRenderedHash) return;
        lastRenderedHash = currentHash;

        document.getElementById('display-question').innerText = data.question || '等待房主出題中...';

        const statusTag = document.getElementById('game-status-tag');
        if (data.status === 'setup') {
          statusTag.innerText = '等待出題';
          statusTag.className = 'text-xs px-2.5 py-0.5 rounded bg-morandi-border/60 text-morandi-muted';
        } else if (data.status === 'playing') {
          statusTag.innerText = '作答中';
          statusTag.className = 'text-xs px-2.5 py-0.5 rounded bg-morandi-primary/20 text-morandi-primary font-medium';
        } else if (data.status === 'revealed') {
          statusTag.innerText = '已開牌';
          statusTag.className = 'text-xs px-2.5 py-0.5 rounded bg-morandi-accent/20 text-morandi-accent font-medium';
        }

        const cardsGrid = document.getElementById('cards-grid');
        const answers = data.answers || {};
        const playerNames = Object.keys(answers);
        const isFlipped = data.status === 'revealed';
        
        document.getElementById('player-count').innerText = playerNames.length;

        if (playerNames.length === 0) {
          cardsGrid.innerHTML = `<div class="col-span-full text-center text-xs text-morandi-muted py-10 bg-morandi-card/50 border border-dashed border-morandi-border rounded-xl">目前尚無人提交答案</div>`;
          return;
        }

        const existingCards = cardsGrid.querySelectorAll('[data-player]');
        if (existingCards.length === playerNames.length && Array.from(existingCards).every((el, i) => el.dataset.player === playerNames[i])) {
          existingCards.forEach(card => {
            const inner = card.querySelector('.card-inner');
            card.querySelector('.answer-text').textContent = answers[card.dataset.player];
            if (isFlipped) {
              inner.classList.add('flipped');
            } else {
              inner.classList.remove('flipped');
            }
          });
          return;
        }

        cardsGrid.innerHTML = '';
        playerNames.forEach(name => {
          const safeName = escapeHTML(name);
          const safeAnswer = escapeHTML(answers[name]);

          const cardWrapper = document.createElement('div');
          cardWrapper.className = 'h-36 perspective-1000';
          cardWrapper.dataset.player = name;
          
          cardWrapper.innerHTML = `
            <div class="card-inner shadow-sm ${isFlipped ? 'flipped' : ''}">
              <div class="card-front bg-morandi-card p-4 flex flex-col justify-between items-center text-center border border-morandi-border">
                <span class="text-xs font-medium text-morandi-muted w-full truncate border-b border-morandi-border/60 pb-1.5">${safeName}</span>
                <div class="flex-grow flex items-center justify-center">
                  <span class="text-2xl opacity-35">🔒</span>
                </div>
                <span class="text-[11px] text-morandi-primary font-medium">已鎖定答案</span>
              </div>

              <div class="card-back bg-morandi-card p-4 flex flex-col justify-between items-center text-center border-2 border-morandi-accent/60">
                <span class="text-xs font-medium text-morandi-muted w-full truncate border-b border-morandi-border/60 pb-1.5">${safeName}</span>
                <div class="flex-grow flex items-center justify-center px-1 overflow-y-auto">
                  <p class="answer-text text-base font-bold text-morandi-text break-words">${safeAnswer}</p>
                </div>
                <span class="text-[11px] text-morandi-accent font-medium">揭曉答案</span>
              </div>
            </div>
          `;
          cardsGrid.appendChild(cardWrapper);
        });
      }

      // 統一使用 addEventListener 綁定所有按鈕事件，避免沙盒環境作用域問題
      function initEvents() {
        document.getElementById('toggle-host-btn').addEventListener('click', toggleHostConsole);
        document.getElementById('btn-random-room').addEventListener('click', generateRandomRoom);
        document.getElementById('btn-join-room').addEventListener('click', joinRoom);
        document.getElementById('btn-leave-room').addEventListener('click', leaveRoom);
        document.getElementById('btn-set-question').addEventListener('click', hostSetQuestion);
        document.getElementById('btn-reveal').addEventListener('click', hostReveal);
        document.getElementById('btn-reset').addEventListener('click', hostReset);
        document.getElementById('btn-submit-answer').addEventListener('click', submitAnswer);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initEvents);
      } else {
        initEvents();
      }
    })();
  </script>
</body>
</html>
